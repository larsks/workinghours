[project]
name = "workinghours"
version = "0.1.2"
description = "Rewrite git commit timestamps to fall within specified time intervals"
requires-python = ">=3.11"
dependencies = ["pygit2", "git-filter-repo", "numpy", "matplotlib"]

[project.scripts]
git-workinghours = "workinghours.cli:main"
git-heatmap = "workinghours.heatmap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workinghours"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
